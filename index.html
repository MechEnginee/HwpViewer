<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HWP 뷰어</title>
  <link rel="stylesheet" href="css/viewer.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5zM7 12h10v1.6H7V12zm0 3.4h10V17H7v-1.6zm0 3.4h6.5v1.6H7v-1.6z"/></svg>
      <span>HWP 뷰어</span>
    </div>
    <label class="btn primary" for="fileInput">파일 열기</label>
    <input id="fileInput" type="file" accept=".hwp,.hwpx" hidden>
    <span id="fileName" class="file-name"></span>
    <span id="dirtyMark" class="dirty" hidden>● 수정됨</span>
    <div class="spacer"></div>
    <div class="edit-tools">
      <button class="btn" id="editBtn" title="편집 모드 켜기/끄기 (Ctrl E)" aria-pressed="false" disabled>편집</button>
      <button class="btn" id="saveBtn" title="저장 (Ctrl S)" disabled>저장</button>
      <button class="btn" id="saveAsBtn" title="다른 이름으로 저장 (Ctrl Shift S)" disabled>다른 이름으로</button>
    </div>
    <span id="pageInfo" class="page-info"></span>
    <div class="zoom">
      <button class="btn" id="zoomOut" title="축소 (Ctrl -)">−</button>
      <button class="btn zoom-val" id="zoomReset" title="100%로">100%</button>
      <button class="btn" id="zoomIn" title="확대 (Ctrl +)">+</button>
      <button class="btn" id="zoomFit" title="폭 맞춤">폭 맞춤</button>
    </div>
    <button class="btn" id="printBtn" title="인쇄 / PDF 저장 (Ctrl P)" disabled>인쇄</button>
  </header>
  <div id="editBar" class="table-tools" hidden>
    <div class="edit-main">
    <span class="label">글자</span>
    <button class="btn" id="painterBtn" title="글자 서식 복사: 누른 뒤 적용할 글자를 드래그 (Esc 취소)">🖌 서식 복사</button>
    <span class="size-box" title="글자 크기 (pt) — 선택한 글자, 선택이 없으면 문단 전체">
      <button class="btn" id="sizeDown" title="글자 작게">−</button>
      <input id="sizeInput" type="number" min="1" max="200" step="0.5" aria-label="글자 크기 (pt)">
      <span class="unit">pt</span>
      <button class="btn" id="sizeUp" title="글자 크게">+</button>
    </span>
    <button class="btn bold-btn" id="boldBtn" title="굵게 (Ctrl B)"><b>B</b></button>
    <span class="sep"></span>
    <span class="label">문단</span>
    <span class="align-box" id="alignBox">
      <button class="btn icon-btn" data-align="left" title="왼쪽 정렬"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1" y="2" width="14" height="1.6" rx=".5"/><rect x="1" y="5.5" width="9" height="1.6" rx=".5"/><rect x="1" y="9" width="14" height="1.6" rx=".5"/><rect x="1" y="12.5" width="9" height="1.6" rx=".5"/></svg></button>
      <button class="btn icon-btn" data-align="center" title="가운데 정렬"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1" y="2" width="14" height="1.6" rx=".5"/><rect x="3.5" y="5.5" width="9" height="1.6" rx=".5"/><rect x="1" y="9" width="14" height="1.6" rx=".5"/><rect x="3.5" y="12.5" width="9" height="1.6" rx=".5"/></svg></button>
      <button class="btn icon-btn" data-align="right" title="오른쪽 정렬"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1" y="2" width="14" height="1.6" rx=".5"/><rect x="6" y="5.5" width="9" height="1.6" rx=".5"/><rect x="1" y="9" width="14" height="1.6" rx=".5"/><rect x="6" y="12.5" width="9" height="1.6" rx=".5"/></svg></button>
      <button class="btn icon-btn" data-align="justify" title="양쪽 정렬"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1" y="2" width="14" height="1.6" rx=".5"/><rect x="1" y="5.5" width="14" height="1.6" rx=".5"/><rect x="1" y="9" width="14" height="1.6" rx=".5"/><rect x="1" y="12.5" width="9" height="1.6" rx=".5"/></svg></button>
    </span>
    <span class="sep"></span>
    <span class="tbl-insert">
      <button class="btn" id="tableBtn" title="표 만들기" aria-haspopup="true" aria-expanded="false">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M1 2h14v12H1V2zm1.3 1.3v2.4h3.4V3.3H2.3zm4.7 0v2.4h2V3.3H7zm3.3 0v2.4h3.4V3.3h-3.4zM2.3 7v2.4h3.4V7H2.3zM7 7v2.4h2V7H7zm3.3 0v2.4h3.4V7h-3.4zM2.3 10.7v2h3.4v-2H2.3zm4.7 0v2h2v-2H7zm3.3 0v2h3.4v-2h-3.4z"/></svg>
        표 ▾
      </button>
      <div id="tablePicker" class="tbl-picker" hidden>
        <div class="tp-label" id="tpLabel">표 만들기</div>
        <div class="tp-grid" id="tpGrid"></div>
        <div class="tp-custom">
          <label>줄 <input id="tpRows" type="number" min="1" max="200" value="3"></label>
          <label>칸 <input id="tpCols" type="number" min="1" max="50" value="3"></label>
          <button class="btn" id="tpMake">표 삽입</button>
        </div>
      </div>
    </span>
    <span id="tableTools" hidden>
      <span class="sep"></span>
      <span class="label">표</span>
      <button class="btn" id="cellPainterBtn" title="셀 서식 복사: 누른 뒤 적용할 셀을 클릭 (Esc 취소)">🖌 셀 서식 복사</button>
      <button class="btn" data-op="rowAbove">위에 행 추가</button>
      <button class="btn" data-op="rowBelow">아래에 행 추가</button>
      <button class="btn" data-op="rowDelete">행 삭제</button>
      <button class="btn" data-op="colLeft">왼쪽에 열 추가</button>
      <button class="btn" data-op="colRight">오른쪽에 열 추가</button>
      <button class="btn" data-op="colDelete">열 삭제</button>
      <button class="btn danger" data-op="tableDelete">표 삭제</button>
      <span class="sep"></span>
      <span class="label">테두리</span>
      <span class="seg" id="borderScope" role="radiogroup" aria-label="테두리 적용 범위">
        <button class="btn active" data-scope="table" role="radio" aria-checked="true" title="표의 모든 선">표 전체</button>
        <button class="btn" data-scope="outer" role="radio" aria-checked="false" title="표의 바깥 테두리만">바깥쪽</button>
        <button class="btn" data-scope="cell" role="radio" aria-checked="false" title="커서가 있는 셀만">현재 셀</button>
      </span>
      <button class="btn" data-border="none" title="테두리 없음">없음</button>
      <button class="btn" data-border="thin" title="얇은 실선 (0.12mm)">실선</button>
      <button class="btn" data-border="thick" title="굵은 실선 (0.4mm)"><b>굵게</b></button>
    </span>
    <span id="painterHint" class="hint" hidden></span>
    </div>
    <span class="history-tools">
      <button class="btn" id="undoBtn" title="실행 취소 (Ctrl Z)" disabled>↶ 실행 취소</button>
      <button class="btn" id="redoBtn" title="다시 실행 (Ctrl Y)" disabled>↷ 다시 실행</button>
      <button class="btn danger" id="resetBtn" title="파일을 처음 열었을 때 상태로 되돌리기" disabled>⟲ 초기화</button>
    </span>
  </div>

  <main id="viewport">
    <div id="empty" class="empty">
      <div class="drop-card">
        <svg viewBox="0 0 24 24" width="56" height="56" aria-hidden="true"><path fill="currentColor" d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm8 1.5V8h4.5L14 3.5zM11 11v4H8l4 4 4-4h-3v-4h-2z"/></svg>
        <h1>한글 문서를 여기에 끌어다 놓으세요</h1>
        <p><b>.hwp</b> (한글 97 이후 5.0 형식) 와 <b>.hwpx</b> 파일을 열고, <b>편집</b>해서 같은 형식으로 저장할 수 있습니다.</p>
        <label class="btn primary big" for="fileInput">파일 선택</label>
        <p class="note">파일은 이 컴퓨터의 브라우저 안에서만 처리되며 어디에도 업로드되지 않습니다.</p>
      </div>
    </div>
    <div id="loading" class="loading" hidden><div class="spinner"></div><span>문서를 여는 중…</span></div>
    <div id="error" class="error" hidden></div>
    <div id="pages" class="pages"></div>
  </main>
  <div id="dropOverlay" class="drop-overlay" hidden>여기에 놓으면 문서가 열립니다</div>

  <script src="js/container.js"></script>
  <script src="js/hwp.js"></script>
  <script src="js/hwpx.js"></script>
  <script src="js/render.js"></script>
  <script src="js/writer-hwp.js"></script>
  <script src="js/writer-hwpx.js"></script>
  <script src="js/history.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
